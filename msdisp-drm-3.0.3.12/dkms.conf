PACKAGE_NAME="msdisp-drm"
PACKAGE_VERSION="3.0.3.12"
AUTOINSTALL="yes"

# The unified top Makefile re-enters kbuild itself; DKMS' default KERNELRELEASE
# env is fine because the Makefile gates on KBUILD_EXTMOD, not KERNELRELEASE.
# The compiler is handled by DKMS itself: it auto-appends "LLVM=1" when the
# running kernel was built with clang (e.g. CachyOS) and uses the default GCC
# otherwise. Do NOT add a manual LLVM=1 or a conditional here — DKMS appends
# LLVM=1 after the whole MAKE string and an if/fi would break the syntax.
MAKE[0]="make KVER=${kernelver}"
CLEAN="make clean"

# Both modules are built at the source-tree root.
BUILT_MODULE_NAME[0]="usbdisp_drm"
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="usbdisp_usb"
DEST_MODULE_LOCATION[1]="/updates"
